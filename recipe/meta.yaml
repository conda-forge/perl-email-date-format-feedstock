{% set name = "perl-email-date-format" %}
{% set version = "1.008" %}
{% set sha256 = "432b7c83ff88749af128003f5257c573aec1a463418db90ed22843cbbc258b4f" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  url: http://cpan.metacpan.org/authors/id/R/RJ/RJBS/Email-Date-Format-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: generic
  number: 0
  script:
    - perl Makefile.PL INSTALLDIRS=vendor NO_PERLLOCAL=1 NO_PACKLIST=1
    - make
    - make test
    - make install VERBINST=1

requirements:
  build:
    - make
  host:
    - perl
    - perl-extutils-makemaker
  run:
    - perl

test:
  imports:
    - Email::Date::Format

about:
  home: https://metacpan.org/dist/Email-Date-Format
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  license_family: OTHER
  summary: 'produce RFC 2822 date strings'
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cbrueffer
